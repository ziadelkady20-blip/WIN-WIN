name: Fix Admin Dashboard client directive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix directive placement
        shell: bash
        run: |
          FILE="winwin-fresh-bv-final/src/components/admin/AdminDashboard.tsx"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("winwin-fresh-bv-final/src/components/admin/AdminDashboard.tsx")
          s = p.read_text()
          bad = 'import type { ReactNode } from "react";\n"use client";\n'
          good = '"use client";\n\nimport type { ReactNode } from "react";\n'
          if bad in s:
              p.write_text(s.replace(bad, good, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add winwin-fresh-bv-final/src/components/admin/AdminDashboard.tsx
          git commit -m "fix: move use client directive before imports"
          git push
